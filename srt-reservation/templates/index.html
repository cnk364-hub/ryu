<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>SRT 자동예약</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- ===== 상단 헤더 ===== -->
    <header class="app-header">
      <div class="d-flex align-items-center justify-content-between px-3 py-2">
        <h1 class="m-0 app-title">🚄 SRT 자동예약</h1>
        <span id="statusBadge" class="badge rounded-pill bg-secondary">대기중</span>
      </div>
    </header>

    <!-- ===== 본문 ===== -->
    <main class="app-main">
      <!-- 홈 -->
      <section class="tab-page" id="page-home">
        <div class="card card-dark mb-3">
          <div class="card-body text-center">
            <div class="text-muted small">현재 상태</div>
            <div id="statusText" class="status-text mt-1">대기중</div>
            <div class="row mt-3 small">
              <div class="col-6 border-end">
                <div class="text-muted">총 조회</div>
                <div id="totalChecks" class="fs-5 fw-bold">0</div>
              </div>
              <div class="col-6">
                <div class="text-muted">마지막 조회</div>
                <div id="lastCheck" class="fs-6">-</div>
              </div>
            </div>
            <div class="mt-3">
              <div class="text-muted small">다음 조회까지</div>
              <div id="countdown" class="countdown">--</div>
            </div>
          </div>
        </div>

        <div class="d-grid gap-2">
          <button id="btnStart" class="btn btn-success btn-lg btn-hapt">▶ 시작</button>
          <button id="btnStop" class="btn btn-danger btn-lg btn-hapt" disabled>■ 중지</button>
        </div>

        <div class="card card-dark mt-3">
          <div class="card-body small">
            <div class="fw-bold mb-1">현재 예약 설정</div>
            <div id="currentCfg" class="text-muted">설정되지 않음</div>
          </div>
        </div>
      </section>

      <!-- 설정 -->
      <section class="tab-page d-none" id="page-config">
        <form id="formReservation" class="d-flex flex-column gap-3">
          <div>
            <label class="form-label">출발역</label>
            <select class="form-select" name="dep_station" required></select>
          </div>
          <div>
            <label class="form-label">도착역</label>
            <select class="form-select" name="arr_station" required></select>
          </div>
          <div>
            <label class="form-label">출발 날짜</label>
            <input type="date" class="form-control" name="dep_date" required />
          </div>
          <div class="row">
            <div class="col-6">
              <label class="form-label">시작 시각</label>
              <input type="time" class="form-control" name="time_from" value="06:00" required />
            </div>
            <div class="col-6">
              <label class="form-label">종료 시각</label>
              <input type="time" class="form-control" name="time_to" value="23:00" required />
            </div>
          </div>
          <div>
            <label class="form-label">좌석 등급</label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="seat_type" id="seat-general" value="general" checked />
              <label class="btn btn-outline-primary" for="seat-general">일반실</label>
              <input type="radio" class="btn-check" name="seat_type" id="seat-special" value="special" />
              <label class="btn btn-outline-primary" for="seat-special">특실</label>
              <input type="radio" class="btn-check" name="seat_type" id="seat-both" value="both" />
              <label class="btn btn-outline-primary" for="seat-both">둘 다</label>
            </div>
          </div>
          <div>
            <label class="form-label">인원수: <span id="paxLabel">1</span>명</label>
            <input type="range" class="form-range" min="1" max="4" step="1" value="1" name="passengers" id="paxRange" />
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-hapt">설정 저장</button>
        </form>
      </section>

      <!-- 계정 -->
      <section class="tab-page d-none" id="page-account">
        <form id="formAccount" class="d-flex flex-column gap-3">
          <div class="card card-dark p-3">
            <h6 class="mb-3">SRT 계정</h6>
            <div class="mb-2">
              <label class="form-label">SRT 아이디(전화번호)</label>
              <input type="text" class="form-control" name="srt_id" inputmode="tel" placeholder="01012345678" />
            </div>
            <div class="mb-2">
              <label class="form-label">SRT 비밀번호</label>
              <div class="input-group">
                <input type="password" class="form-control" name="srt_password" id="srtPw" autocomplete="new-password" />
                <button type="button" class="btn btn-outline-secondary" id="togglePw" aria-label="toggle">👁</button>
              </div>
              <div class="form-text" id="srtPwHint">저장된 비밀번호가 없습니다.</div>
            </div>
            <div class="d-grid gap-2">
              <button type="button" class="btn btn-primary btn-hapt" id="btnSaveSrt">💾 SRT 계정 저장</button>
              <button type="button" class="btn btn-outline-info btn-hapt" id="btnTestLogin">SRT 로그인 테스트 (저장 후)</button>
            </div>
          </div>

          <div class="card card-dark p-3">
            <h6 class="mb-3">카카오톡</h6>
            <div class="mb-2">
              <label class="form-label">REST API 키</label>
              <input type="text" class="form-control" name="kakao_rest_api_key" />
            </div>
            <div class="mb-2">
              <label class="form-label">액세스 토큰</label>
              <input type="password" class="form-control" name="kakao_access_token" />
              <div class="form-text" id="kakaoAtHint">저장된 값이 없습니다.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">리프레시 토큰</label>
              <input type="password" class="form-control" name="kakao_refresh_token" />
              <div class="form-text" id="kakaoRtHint">저장된 값이 없습니다.</div>
            </div>
            <div class="d-grid gap-2">
              <button type="button" class="btn btn-primary btn-hapt" id="btnSaveKakao">💾 카카오 설정 저장</button>
              <button type="button" class="btn btn-outline-info btn-hapt" id="btnTestKakao">카카오 테스트 메시지 (저장 후)</button>
            </div>
          </div>

          <button type="submit" class="btn btn-success btn-lg btn-hapt">✅ 전체 저장</button>
        </form>
      </section>

      <!-- 이력 -->
      <section class="tab-page d-none" id="page-history">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="m-0">최근 50건</h6>
          <button class="btn btn-sm btn-outline-danger btn-hapt" id="btnClearHistory">이력 초기화</button>
        </div>
        <div id="historyList" class="d-flex flex-column gap-2"></div>
      </section>

      <!-- 로그 -->
      <section class="tab-page d-none" id="page-logs">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="m-0">실시간 로그</h6>
          <div class="btn-group btn-group-sm">
            <a class="btn btn-outline-secondary btn-hapt" href="/api/logs/download">다운로드</a>
            <button class="btn btn-outline-danger btn-hapt" id="btnClearLogs">지우기</button>
          </div>
        </div>
        <div id="logView" class="log-view"></div>
      </section>
    </main>

    <!-- ===== 하단 탭 ===== -->
    <nav class="app-tabs">
      <button class="tab-btn active" data-tab="home">🏠<span>홈</span></button>
      <button class="tab-btn" data-tab="config">⚙️<span>설정</span></button>
      <button class="tab-btn" data-tab="account">👤<span>계정</span></button>
      <button class="tab-btn" data-tab="history">📋<span>이력</span></button>
      <button class="tab-btn" data-tab="logs">📄<span>로그</span></button>
    </nav>
  </div>

  <!-- 로딩 스피너 -->
  <div id="spinner" class="spinner-overlay d-none">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <!-- 토스트 -->
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1080">
    <div id="appToast" class="toast align-items-center text-bg-dark border-0" role="alert">
      <div class="d-flex">
        <div id="appToastBody" class="toast-body">메시지</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- 성공 축하 모달 -->
  <div class="modal fade" id="successModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content celebration">
        <div class="modal-body text-center p-5">
          <div class="display-1">🎉</div>
          <h2 class="mt-3 fw-bold">예약 성공!</h2>
          <p id="successDetail" class="mt-2"></p>
          <button type="button" class="btn btn-light btn-lg mt-3" data-bs-dismiss="modal">확인</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 내장 스테이션 목록 (서버 렌더) -->
  <script id="stationsData" type="application/json">
    {{ stations | tojson }}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
