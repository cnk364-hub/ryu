<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d1117">
    <title>SRT 자동예약</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
    <header class="app-header">
        <span class="header-title"><i class="bi bi-train-freight-front-fill"></i> SRT 자동예약</span>
        <span id="header-status" class="badge bg-secondary">대기중</span>
    </header>

    <main class="app-main">

        <!-- 홈 -->
        <section id="tab-home" class="tab-pane active">
            <div class="card status-card mb-3">
                <div class="card-body text-center">
                    <div class="status-indicator" id="status-indicator">
                        <i class="bi bi-circle-fill"></i>
                    </div>
                    <h3 id="status-text" class="mt-2">대기중</h3>
                    <div class="mt-3 stats-row">
                        <div class="stat">
                            <div class="stat-value" id="total-queries">0</div>
                            <div class="stat-label">총 조회</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="countdown">-</div>
                            <div class="stat-label">다음 조회</div>
                        </div>
                    </div>
                    <div class="mt-2 text-muted small">
                        마지막 조회: <span id="last-query">-</span>
                    </div>
                </div>
            </div>

            <button id="btn-start" class="btn btn-success btn-xl w-100 mb-2">
                <i class="bi bi-play-fill"></i> 자동예약 시작
            </button>
            <button id="btn-stop" class="btn btn-danger btn-xl w-100 d-none">
                <i class="bi bi-stop-fill"></i> 중지
            </button>

            <div class="mt-3 small text-muted">
                <div><strong>구간:</strong> <span id="summary-section">-</span></div>
                <div><strong>날짜:</strong> <span id="summary-date">-</span></div>
                <div><strong>시간대:</strong> <span id="summary-time">-</span></div>
                <div><strong>좌석:</strong> <span id="summary-seat">-</span></div>
                <div><strong>계정:</strong> <span id="summary-profile">-</span></div>
            </div>
        </section>

        <!-- 설정 -->
        <section id="tab-settings" class="tab-pane">
            <h5 class="mb-3"><i class="bi bi-gear-fill"></i> 예약 설정</h5>
            <form id="settings-form">
                <div class="mb-3">
                    <label class="form-label">출발역</label>
                    <select class="form-select" id="dep_station" required></select>
                </div>
                <div class="mb-3">
                    <label class="form-label">도착역</label>
                    <select class="form-select" id="arr_station" required></select>
                </div>
                <div class="mb-3">
                    <label class="form-label">출발 날짜</label>
                    <input type="date" class="form-control" id="dep_date" required>
                </div>
                <div class="row g-2">
                    <div class="col-6 mb-3">
                        <label class="form-label">시작 시각</label>
                        <input type="time" class="form-control" id="time_from" value="06:00" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">종료 시각</label>
                        <input type="time" class="form-control" id="time_to" value="22:00" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">좌석 등급</label>
                    <select class="form-select" id="seat_class">
                        <option value="GENERAL">일반실</option>
                        <option value="SPECIAL">특실</option>
                        <option value="ANY" selected>둘 다</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">인원수</label>
                    <select class="form-select" id="passengers">
                        <option value="1">1명</option>
                        <option value="2">2명</option>
                        <option value="3">3명</option>
                        <option value="4">4명</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-xl w-100">
                    <i class="bi bi-save-fill"></i> 설정 저장
                </button>
            </form>
        </section>

        <!-- 계정 -->
        <section id="tab-account" class="tab-pane">
            <h5 class="mb-3"><i class="bi bi-person-fill"></i> 계정 관리</h5>

            <div id="profiles-list" class="mb-3"></div>

            <div class="card mb-3">
                <div class="card-body">
                    <h6 id="profile-form-title">새 프로필 추가</h6>
                    <form id="profile-form">
                        <input type="hidden" id="profile_id">
                        <div class="mb-2">
                            <label class="form-label">프로필 이름</label>
                            <input type="text" class="form-control" id="profile_name" maxlength="20"
                                   placeholder="예: 아빠, 엄마, 본인" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">SRT 아이디 (회원번호/이메일/전화번호)</label>
                            <input type="text" class="form-control" id="srt_id" required autocomplete="off">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">SRT 비밀번호</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="srt_pw" autocomplete="off">
                                <button type="button" class="btn btn-outline-secondary" id="toggle-pw">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="form-text" id="pw-hint">수정 시 비워두면 기존 비밀번호 유지</div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-outline-info flex-fill" id="btn-login-test">
                                <i class="bi bi-shield-check"></i> 로그인 테스트
                            </button>
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="bi bi-save"></i> 저장
                            </button>
                        </div>
                        <button type="button" class="btn btn-outline-secondary w-100 mt-2 d-none" id="btn-cancel-edit">
                            취소
                        </button>
                    </form>
                </div>
            </div>
        </section>

        <!-- 이력 -->
        <section id="tab-history" class="tab-pane">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0"><i class="bi bi-list-check"></i> 예약 이력</h5>
                <button class="btn btn-sm btn-outline-danger" id="btn-clear-history">
                    <i class="bi bi-trash"></i> 초기화
                </button>
            </div>
            <div id="history-list"></div>
        </section>

        <!-- 로그 -->
        <section id="tab-logs" class="tab-pane">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0"><i class="bi bi-journal-text"></i> 실시간 로그</h5>
                <div>
                    <button class="btn btn-sm btn-outline-info" id="btn-download-logs">
                        <i class="bi bi-download"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" id="btn-clear-logs">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" id="auto-scroll" checked>
                <label class="form-check-label small" for="auto-scroll">자동 스크롤</label>
            </div>
            <div id="log-container" class="log-container"></div>
        </section>

    </main>

    <nav class="tab-nav">
        <button class="nav-btn active" data-tab="home">
            <i class="bi bi-house-fill"></i><span>홈</span>
        </button>
        <button class="nav-btn" data-tab="settings">
            <i class="bi bi-gear-fill"></i><span>설정</span>
        </button>
        <button class="nav-btn" data-tab="account">
            <i class="bi bi-person-fill"></i><span>계정</span>
        </button>
        <button class="nav-btn" data-tab="history">
            <i class="bi bi-list-check"></i><span>이력</span>
        </button>
        <button class="nav-btn" data-tab="logs">
            <i class="bi bi-journal-text"></i><span>로그</span>
        </button>
    </nav>
</div>

<div class="modal fade" id="welcomeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">👋 환영합니다!</h5>
            </div>
            <div class="modal-body">
                <p>SRT 자동예약을 시작하기 전에, <strong>계정 탭</strong>에서 SRT 아이디/비밀번호를 먼저 등록해주세요.</p>
                <p class="small text-muted mb-0">비밀번호는 암호화되어 저장되며, 서버 외부로 전송되지 않습니다.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="goto-account">
                    계정 탭으로 이동
                </button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="successModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content success-modal">
            <div class="modal-body text-center py-5">
                <div class="celebration">🎉</div>
                <h1 class="mt-3">예약 성공!</h1>
                <div id="success-detail" class="mt-3"></div>
                <button type="button" class="btn btn-light btn-xl mt-4" data-bs-dismiss="modal">
                    확인
                </button>
            </div>
        </div>
    </div>
</div>

<audio id="success-audio" preload="auto">
    <source src="https://cdn.jsdelivr.net/gh/anars/blank-audio@master/2-seconds-of-silence.mp3" type="audio/mpeg">
</audio>

<div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
