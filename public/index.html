<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>축산 AI 에이전트 데모 - 가축 질병 조기경보 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    };
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="./simulator.js"></script>
  <style>
    body { background: #0a0f1a; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1f2937; border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    @keyframes pulse-border { 0%,100%{opacity:.3} 50%{opacity:1} }
    .risk-emergency { box-shadow: inset 0 0 0 2px rgba(239,68,68,0.5); animation: pulse-border 1.5s ease-in-out infinite; }
    .risk-danger { box-shadow: inset 0 0 0 2px rgba(249,115,22,0.4); }
    .risk-caution { box-shadow: inset 0 0 0 2px rgba(234,179,8,0.3); }
    @keyframes spin-slow { to { transform: rotate(360deg); } }
    .agent-pulse { animation: pulse-border 1.5s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div id="root"></div>
  <div id="error-panel" style="display:none; position:fixed; top:12px; left:12px; right:12px; z-index:9999; background:#7f1d1d; color:#fecaca; border:1px solid #ef4444; border-radius:8px; padding:14px; font-family:ui-monospace,Menlo,monospace; font-size:12px; white-space:pre-wrap; max-height:50vh; overflow:auto;"></div>
  <script>
    (function(){
      var panel = document.getElementById('error-panel');
      function show(msg){ panel.style.display='block'; panel.textContent = msg; }
      window.addEventListener('error', function(e){
        show('[JS Error] ' + (e.message || e.error) + '\n' + (e.filename||'') + ':' + (e.lineno||'') );
      });
      window.addEventListener('unhandledrejection', function(e){
        show('[Promise Rejection] ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      // Guard: if #root is still empty after 4s, show a hint
      setTimeout(function(){
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0 && panel.style.display === 'none') {
          show('[Render Timeout] 4초 내 화면이 렌더링되지 않았습니다. DevTools Console을 확인하거나, /app.js 와 /mock-data/responses.json 요청이 200으로 응답했는지 확인하세요.');
        }
      }, 4000);
    })();
  </script>
  <script type="text/babel" src="./app.js"></script>
</body>
</html>
